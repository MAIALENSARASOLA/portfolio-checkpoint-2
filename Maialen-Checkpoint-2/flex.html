<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios Flexbox Maialen</title>
    <link rel="stylesheet" href="flex.css">
</head>
<body>

    <div class="flexOne">
        <div class="square">1</div>
        <div class="square">2</div>
        <div class="square">3</div>
    </div>

    <div class="flexTwo">
        <div class="square">1</div>
        <div class="square">2</div>
        <div class="square">3</div>
    </div>

    <div class="flexThree">
        <div class="square">1</div>
        <div class="square">2</div>
        <div class="square">3</div>
    </div>

    <div class="flexFour">
        <div class="square">1</div>
        <div class="square">2</div>
        <div class="square">3</div>
        <div class="square">4</div>
    </div>

    <div class="flexFive">
        <div class="item">1</div>
        <div class="item" id="grow">2 (elástico)</div>
        <div class="item">3</div>
    </div>

    <div class="flexSix">
        <div class="one"><div class="square"></div><div class="square"></div></div>
        <div class="two"><div class="square"></div><div class="square"></div></div>
        <div class="three"><div class="square"></div><div class="square"></div></div>
    </div>

    <div class="flexSeven">
        <div class="one"><div class="square"></div></div>
        <div class="two"><div class="square"></div></div>
        <div class="three"><div class="square"></div></div>
        <div class="four"><div class="square"></div></div>
    </div>

    <div class="flexEight">
        <div class="one"><div class="square"></div></div>
        <div class="two"><div class="square"></div></div>
        <div class="three"><div class="square"></div></div>
    </div>

    <div class="flexNine">
        <div class="square">1</div>
        <div class="square">2</div>
        <div class="square" id="special">3</div>
    </div>

</body>
</html>
