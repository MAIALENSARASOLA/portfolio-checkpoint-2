
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M1C2 Flexbox Assignment</title>
    <link rel="stylesheet" href="flex.css" />
  </head>

  <body>
    <div class="page">
      <!-- Flexbox 1 -->
      <div class="flexOne">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <!-- Flexbox 2 -->
      <div class="flexTwo">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <!-- Flexbox 3 -->
      <div class="flexThree">
        <div class="square">1</div>
        <div class="square">2</div>
        <div class="square">3</div>
      </div>

      <!-- Flexbox 4 (SIN fondo verde) -->
      <div class="flexFour">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </div>

      <!-- Flexbox 5 -->
      <div class="flexFive">
        <div class="item"></div>
        <div class="item" id="grow"></div>
        <div class="item"></div>
      </div>

      <!-- Flexbox 6 (9 cuadrados) -->
      <div class="flexSix">
        <div class="one">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="two">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="three">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>

      <!-- Flexbox 7 (9 cuadrados: 2+2+2+3) -->
      <div class="flexSeven">
        <div class="one">
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="two">
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="three">
          <div class="square"></div>
          <div class="square"></div>
        </div>

        <div class="four">
          <div class="square"></div>
          <div class="square"></div>
          <div class="square"></div>
        </div>
      </div>

      <!-- Flexbox 8 -->
      <div class="flexEight">
        <div class="one">
          <div class="square"></div>
        </div>

        <div class="two">
          <div class="square"></div>
        </div>

        <div class="three">
          <div class="square"></div>
        </div>
      </div>

      <!-- Flexbox 9 (4 cuadrados, uno baja) -->
      <div class="flexNine">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square" id="special"></div>
        <div class="square"></div>
      </div>
    </div>
  </body>
</html>
